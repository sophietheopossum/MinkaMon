[package]
name = "minkamon-sampler"
version = "0.1.0"
edition = "2021"
description = "Rust system sampler for MinkaMon: JSON-lines stats over stdio"

# A library: MinkaDE's one binary (minka/, at the top of the checkout) runs it
# under the name it was started as. Nothing is built from here alone.
[lib]
name = "minkamon_sampler"
path = "src/lib.rs"
doctest = false

[dependencies]
flate2 = "1"
libc = "0.2"
libloading = "0.8"
serde_json = "1"
