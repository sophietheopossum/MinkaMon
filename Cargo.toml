[package]
name = "minkamon"
version = "0.1.0"
edition = "2024"
description = "Minka system monitor, fed by minkamon-sampler over stdio"

[[bin]]
name = "minkamon"
path = "src/main.rs"

[dependencies]
anti-webui = { git = "https://github.com/bea4dev/AntiWebUI", rev = "25e82a1d2a7a08658f0eede14cde47b34cce40a6", default-features = false, features = ["wayland", "wayland-shell", "shell-apps", "shell-process"] }
calloop = { version = "0.14", default-features = false }
minka-ipc = { package = "MinkaIPC", path = "../MinkaIPC" }
serde_json = "1"

[profile.release]
lto = "thin"

# AntiWebUI's workspace patches wgpu to bea4dev's adapter-filter fork. Cargo
# ignores patch tables from git dependencies, so the consuming crate has to
# carry the same patches (pinned to the fork revision in AntiWebUI's lockfile).
[patch.crates-io]
naga = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
naga-types = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu-core = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu-core-deps-apple = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu-core-deps-emscripten = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu-hal = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu-naga-bridge = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu-types = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
